schema: '2.0'
stages:
  prepare_data:
    cmd: PYTHONPATH=. uv run python src/data/make_dataset.py data/raw/WineQT.csv
      data/processed/wine_processed.csv --params-path params.json --config-path 
      conf/config.yaml
    deps:
    - path: conf/config.yaml
      hash: md5
      md5: 5860b72a756f18981e225c38cbb98e5c
      size: 553
    - path: data/raw/WineQT.csv
      hash: md5
      md5: e2e57e4c41e6ee0213fb12e5a70f4bfb
      size: 78057
    - path: src/data/make_dataset.py
      hash: md5
      md5: 19bc27371dd64abc3d8332639f5e299c
      size: 6309
    params:
      params.json:
        data:
          feature_scaling: true
    outs:
    - path: data/processed/wine_processed.csv
      hash: md5
      md5: be51dff919d2d7d2a5dc1a1cde4395fd
      size: 250585
  train_model:
    cmd: PYTHONPATH=. uv run python src/models/train_model.py 
      data/processed/wine_processed.csv models/model.pkl reports/metrics.json 
      --params-path params.json --config-path conf/config.yaml
    deps:
    - path: conf/config.yaml
      hash: md5
      md5: 5860b72a756f18981e225c38cbb98e5c
      size: 553
    - path: data/processed/wine_processed.csv
      hash: md5
      md5: be51dff919d2d7d2a5dc1a1cde4395fd
      size: 250585
    - path: src/models/train_model.py
      hash: md5
      md5: 13616dc95bb684628b29511fb3a97e3c
      size: 13234
    params:
      params.json:
        train:
          random_state: 13
          test_size: 0.2
          model:
            logistic_regression:
              max_iter: 500
              multi_class: auto
          mlflow:
            experiment_name: wine-quality
            run_name_prefix: baseline
            model_name: wine-quality-model
    outs:
    - path: models/model.pkl
      hash: md5
      md5: 895975e077b5c7d05959423173b3ce77
      size: 1879
    - path: reports/metrics.json
      hash: md5
      md5: 6cbf3563e99592cfc2c829a8d1739b20
      size: 902
  visualize:
    cmd: PYTHONPATH=. uv run python src/visualization/visualize.py 
      reports/metrics.json reports/figures --config-path conf/config.yaml
    deps:
    - path: conf/config.yaml
      hash: md5
      md5: 5860b72a756f18981e225c38cbb98e5c
      size: 553
    - path: reports/metrics.json
      hash: md5
      md5: 6cbf3563e99592cfc2c829a8d1739b20
      size: 902
