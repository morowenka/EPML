# Base configuration for Wine Quality ML pipeline
# Use with: python script.py --config-name=config
# Override with: python script.py --config-name=config_rf

# Paths configuration
paths:
  raw_data: data/raw/WineQT.csv
  processed_data: data/processed/wine_processed.csv
  model: models/model.pkl
  metrics: reports/metrics.json
  statistics: reports/statistics.json
  figures: reports/figures

# Data processing parameters
data:
  feature_scaling: true

# Training parameters
train:
  random_state: 13
  test_size: 0.2
  model:
    type: logistic_regression
    logistic_regression:
      max_iter: 500
      C: 1.0
      penalty: l2
      solver: lbfgs
  mlflow:
    experiment_name: wine-quality
    run_name_prefix: baseline
    model_name: wine-quality-model

# Visualization parameters
visualization:
  enabled: true

# Monitoring parameters
monitoring:
  log_file: experiments.log
  enabled: true

# Hydra configuration
hydra:
  run:
    dir: .
  output_subdir: null
  sweep:
    dir: .
    subdir: .
