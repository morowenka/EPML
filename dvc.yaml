stages:
  prepare_data:
    cmd: PYTHONPATH=. uv run python src/data/make_dataset.py
    deps:
    - src/data/make_dataset.py
    - data/raw/WineQT.csv
    - conf/config.yaml
    params:
    - conf/config.yaml:
      - data
      - paths.raw_data
      - paths.processed_data
    outs:
    - data/processed/wine_processed.csv

  # These two stages run in PARALLEL after prepare_data
  # (independent branches in DAG)

  train_model:
    cmd: PYTHONPATH=. uv run python src/models/train_model.py
    deps:
    - data/processed/wine_processed.csv
    - src/models/train_model.py
    - conf/config.yaml
    params:
    - conf/config.yaml:
      - train
      - paths.processed_data
      - paths.model
      - paths.metrics
    outs:
    - models/model.pkl
    metrics:
    - reports/metrics.json:
        cache: false

  compute_statistics:
    cmd: PYTHONPATH=. uv run python src/data/compute_statistics.py
    deps:
    - data/processed/wine_processed.csv
    - src/data/compute_statistics.py
    - conf/config.yaml
    params:
    - conf/config.yaml:
      - data
      - paths.processed_data
      - paths.statistics
    outs:
    - reports/statistics.json

  visualize:
    cmd: PYTHONPATH=. uv run python src/visualization/visualize.py
    deps:
    - reports/metrics.json
    - src/visualization/visualize.py
    - conf/config.yaml
    params:
    - conf/config.yaml:
      - visualization
      - paths.metrics
      - paths.figures
    outs:
    - reports/figures/metrics_summary.png
