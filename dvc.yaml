stages:
  prepare_data:
    cmd: PYTHONPATH=. uv run python src/data/make_dataset.py
    deps:
    - src/data/make_dataset.py
    - data/raw/WineQT.csv
    - conf/config.yaml
    params:
    - conf/config.yaml:
      - data
      - paths.raw_data
      - paths.processed_data
    outs:
    - data/processed/wine_processed.csv

  # Parallel stage - runs train_model and compute_statistics in REAL parallel via Make
  parallel_stages:
    cmd: make -j2 parallel-stages
    deps:
    - data/processed/wine_processed.csv
    - src/models/train_model.py
    - src/data/compute_statistics.py
    - conf/config.yaml
    - Makefile
    params:
    - conf/config.yaml:
      - train
      - data
      - paths
    outs:
    - models/model.pkl
    - reports/statistics.json
    metrics:
    - reports/metrics.json:
        cache: false

  visualize:
    cmd: PYTHONPATH=. uv run python src/visualization/visualize.py
    deps:
    - reports/metrics.json
    - src/visualization/visualize.py
    - conf/config.yaml
    params:
    - conf/config.yaml:
      - visualization
      - paths.metrics
      - paths.figures
    outs:
    - reports/figures/metrics_summary.png
