[project]
name = "wine-quality-workspace"
version = "0.1.0"
description = "Data science workspace for Kaggle wine-quality dataset."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mark Basov" }]

dependencies = [
    "click==8.1.7",
    "pandas==2.2.3",
    "python-dotenv==1.0.1",
    "kaggle==1.6.17",
    "scikit-learn==1.5.2",
    "mlflow==3.7.0",
    "pyarrow==22.0.0",
    "omegaconf==2.3.0",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "clearml==1.15.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = ["E", "F", "W", "I", "UP", "B"]
lint.ignore = [
    "E501",  # handled by formatter
]

[tool.ruff.format]
preview = true

[dependency-groups]
dev = [
    "dvc==3.59.0",
    "pre-commit==4.0.1",
    "ruff==0.7.1",
]
docs = [
    "sphinx==7.2.6",
    "sphinx-rtd-theme==2.0.0",
    "sphinx-autodoc-typehints==1.25.2",
    "myst-parser==2.0.0",
]
